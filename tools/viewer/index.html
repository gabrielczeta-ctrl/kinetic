<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KINETIC Behaviour Viewer</title>
<style>
:root {
  --bg: #0f141a; --panel: #161d25; --panel2: #1c2530; --line: #2a3644; --text: #dbe5ee; --dim: #8a9bab;
  --accent: #5fb3ff; --ok: #6fcf7f; --bad: #ff6b6b; --warn: #f2c94c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
#app { display: grid; grid-template-columns: 290px 1fr 330px; grid-template-rows: 44px 1fr 92px; height: 100vh; }
header { grid-column: 1 / 4; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0; letter-spacing: .5px; }
header h1 span { color: var(--accent); }
header .sp { flex: 1; }
select, input, button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: #24425e; border-color: var(--accent); }
#side { overflow: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 10px; }
#side input { width: 100%; margin-bottom: 8px; }
.fam { margin: 10px 0 4px; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
.case { padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.case:hover { background: var(--panel2); }
.case.sel { background: #22384d; }
.case .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.tag { font-size: 10px; padding: 0 5px; border-radius: 4px; background: var(--panel2); color: var(--dim); }
#stage { position: relative; overflow: hidden; }
#stage canvas { display: block; }
#hud { position: absolute; left: 10px; top: 10px; background: rgba(15,20,26,.78); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 12px/1.5 ui-monospace, monospace; pointer-events: none; min-width: 210px; }
#legend { position: absolute; right: 10px; top: 10px; background: rgba(15,20,26,.78); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 11px; pointer-events: none; }
#legend div { display: flex; align-items: center; gap: 6px; }
[hidden] { display: none !important; }
#empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 15px; text-align: center; padding: 20px; }
#right { overflow: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 12px; }
#right h2 { font-size: 14px; margin: 0 0 6px; }
#right h3 { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 6px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; margin: 0 4px 4px 0; background: var(--panel2); }
.badge.ok { background: #1f3d29; color: var(--ok); } .badge.bad { background: #4a2020; color: var(--bad); }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
td { padding: 2px 4px; border-bottom: 1px solid var(--line); }
td:first-child { color: var(--dim); }
td.bad { color: var(--bad); }
#events div { padding: 2px 4px; border-radius: 4px; cursor: pointer; font: 11px/1.4 ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#events div:hover { background: var(--panel2); }
#events div.now { background: #2b3b1f; }
video { width: 100%; border-radius: 6px; background: #000; margin-top: 4px; }
#bar { grid-column: 1 / 4; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 8px 14px; background: var(--panel); border-top: 1px solid var(--line); }
#controls { display: flex; gap: 6px; align-items: center; }
#time { font: 12px ui-monospace, monospace; min-width: 120px; text-align: center; }
#timeline { width: 100%; height: 72px; cursor: pointer; display: block; }
@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 44px 180px 50vh auto 110px; height: auto; }
  header, #bar { grid-column: 1; }
  #side, #right { border: 0; }
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <header>
    <h1>KINETIC <span>Behaviour Viewer</span></h1>
    <select id="run" title="Recorded run"></select>
    <span class="sp"></span>
    <label>Compare <select id="ghost" title="The same case from another run, drawn as an orange ghost"><option value="">-</option></select></label>
    <button id="follow" class="on" title="Camera follows the body (F)">Follow</button>
    <button id="side-view" title="Camera from the side (S)">Side</button>
    <button id="trail" class="on" title="Centre-of-mass trail (T)">Trail</button>
  </header>
  <aside id="side">
    <input id="search" placeholder="Filter cases...">
    <div id="cases"></div>
  </aside>
  <main id="stage">
    <div id="empty">Loading the recorded runs...</div>
    <div id="hud" hidden></div>
    <div id="legend">
      <div><span class="dot" style="background:#7fd17f"></span>standing</div>
      <div><span class="dot" style="background:#9fd1ff"></span>bracing</div>
      <div><span class="dot" style="background:#f2c94c"></span>stumbling</div>
      <div><span class="dot" style="background:#ff6b6b"></span>falling / fallen</div>
      <div><span class="dot" style="background:#b28dff"></span>getting up</div>
      <div><span class="dot" style="background:#ffd23f"></span>centre of mass</div>
      <div><span class="dot" style="background:#ff4d6d"></span>contacts</div>
      <div><span class="dot" style="background:#ff9f43"></span>compare (ghost)</div>
    </div>
  </main>
  <aside id="right">
    <h2 id="title">-</h2>
    <div id="badges"></div>
    <div id="film-box" hidden>
      <h3>Game footage</h3>
      <video id="film" muted playsinline preload="auto"></video>
      <div id="film-note" style="color:var(--dim);font-size:11px"></div>
    </div>
    <h3>Verdict (what I judge by)</h3>
    <div id="verdict"></div>
    <h3>Events (click to jump)</h3>
    <div id="events"></div>
  </aside>
  <footer id="bar">
    <div id="controls">
      <button id="play" title="Play / pause (space)">Play</button>
      <button id="back" title="Frame back (left)">&lsaquo;</button>
      <button id="fwd" title="Frame forward (right)">&rsaquo;</button>
      <select id="speed" title="Speed">
        <option value="0.1">0.1x</option><option value="0.25">0.25x</option><option value="0.5">0.5x</option>
        <option value="1" selected>1x</option><option value="2">2x</option>
      </select>
      <span id="time">0.00 / 0.00 s</span>
    </div>
    <canvas id="timeline"></canvas>
  </footer>
</div>
<script type="module" src="viewer.js"></script>
</body>
</html>
