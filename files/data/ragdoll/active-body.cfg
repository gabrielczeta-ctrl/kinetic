# Active body (wobbly physical body) settings.
# Loaded at startup from the file named by OPENMW_RAGDOLL_ACTIVE_BODY
# (Run-Game.cmd points at this file). Edit, save, restart the game.
# Units: frequencies in Hz; caps in g (angular caps: g / gyration_radius).

# Balance springs toward the character (capsule + animation pelvis).
horizontal_frequency = 3
vertical_frequency = 6
yaw_frequency = 8
tilt_frequency = 20
damping_ratio = 2

horizontal_cap = 5
up_cap = 3
down_cap = 1
yaw_cap = 20
tilt_cap = 40
gyration_radius = 15
# Extra upright authority on the pelvis alone (running legs tip it over).
root_tilt_boost = 4
# Same for the pelvis yaw (hip swivel at every step).
root_yaw_boost = 1
# How fast the character can change running velocity (u/s^2; 686 = 1 g; 0 = instant).
capsule_acceleration = 1400
# How fast the body turns toward where you face (deg/s).
max_yaw_rate = 240
# Pelvis orientation through the constraint solver (1) instead of external
# torques (0): a kinematic anchor + 6-DOF rotation motor, spring in Hz and
# torque cap in body weight x gyration radius.
rotation_constraint = 1
# 60 (was 25): with the spine joints no longer clipping the lean, a stiffer
# pelvis anchor halves the pelvis rocking and brings the running chest pitch
# to 8.6 deg of the animation's 7.2 (13.2 at 25; course 2026-09-28).
anchor_frequency = 60
anchor_torque = 5

# Upper-body weight carried by the balance force (1 = all).
weight_support = 1
# Ground routing: 0 = that part of the balance force is external (harness
# feel); 1 = it is taken back out of the grounded feet, so the legs carry it.
# Vertical = the weight; horizontal = pushing the feet along the floor.
ground_routing = 0.8
ground_routing_horizontal = 0
# With no foot down for longer than a stride (s), support fades back in.
air_catch_delay = 0.12
air_catch_fade = 0.1

# Hits: balance lost per impulse, recovery, shove and stumble steps.
hit_zero_at = 5000
hit_recovery_per_second = 1.2
hit_floor = 0.15
topple_up_dot = 0.5
shove_speed = 160
stumble_seconds = 0.4
stumble_threshold = 0.35
get_up_strength = 0.8
