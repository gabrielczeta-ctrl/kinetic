# Ragdoll settings for play (Run-Game.cmd sets OPENMW_RAGDOLL_SETTINGS to this
# file). One "NAME = value" per line; an environment variable of the same name
# still wins. Commented lines show the built-in default - uncomment to change.
# The active body's own tuning lives in active-body.cfg next to this file.

# --- Body -------------------------------------------------------------------
# The active (wobbly) body: a capped balance force instead of a rigid root.
OPENMW_RAGDOLL_SOFT_ROOT = 1
OPENMW_RAGDOLL_SOFT_ROOT_INERTIA = 0
# NPCs within 2000 units of the player get physical bodies (at most 10).
OPENMW_RAGDOLL_POWER_NPCS = 1
# NPCs raise their guard by Block skill x this.
# OPENMW_RAGDOLL_AI_GUARD = 1

# --- Legs -------------------------------------------------------------------
# Animation joint-velocity feed-forward: hip, knee, foot.
# OPENMW_RAGDOLL_LEG_FEEDFORWARD_JOINTS = 0.9,2,1
# Walking: hip feed-forward x stance, x swing (push-off drive; less swing overshoot).
# OPENMW_RAGDOLL_LEG_HIP_PHASE = 1.8,1.2
# Extra multipliers while running (above 180 units/s).
# OPENMW_RAGDOLL_LEG_FEEDFORWARD_RUN = 1,1,1
# Lift a swinging foot that hangs lower than the animation (gain, 0 = off).
# OPENMW_RAGDOLL_SWING_CLEARANCE = 1
# Steer a swinging foot sideways against its error (gain, 0 = off; measured no effect).
# OPENMW_RAGDOLL_SWING_LATERAL = 0
# Place each foot on the ground under it, e.g. on stairs (gain, 0 = off).
# OPENMW_RAGDOLL_FOOT_GROUNDING = 1
# Pull a stance foot the clip holds above its resting height down to it (running; gain, 0 = off).
# OPENMW_RAGDOLL_STANCE_GROUND = 1
# Turn the legs toward the direction of travel on diagonals (gain, window deg).
# OPENMW_RAGDOLL_LEG_TRAVEL_YAW = 1
# OPENMW_RAGDOLL_LEG_TRAVEL_WINDOW = 80
# Draw the feet up while off the ground, units (Morrowind has no jump clip; 0 = off).
# OPENMW_RAGDOLL_JUMP_TUCK = 16
# Vertical cap multiplier while the body rides a jump (0 = off).
# OPENMW_RAGDOLL_JUMP_CAP = 2
# Running: fraction of the trailing foot's kick beyond 25 units behind the pelvis kept (1 = off).
# OPENMW_RAGDOLL_RUN_BACK_KICK = 0.5
# Match the animation stride to the travel speed while running too (0 = walk only).
# OPENMW_RAGDOLL_RUN_STRIDE_MATCH = 1
# Stride matching samples a foot as planted while its clip lift is within this
# many units of its recent minimum (units, time constant s; 0 = physical contact).
# OPENMW_RAGDOLL_STRIDE_STANCE_LIFT = 2,0.7
# Upper limit of the animation speed factor while running.
# OPENMW_RAGDOLL_RUN_STRIDE_CAP = 1.35
# After a stop the body keeps where its momentum carried it (up to this many
# units) instead of being pulled back to the capsule: the backward rebound
# after running (0 = off). Used only with STOP_CARRY = 0.
# OPENMW_RAGDOLL_STOP_ABSORB = 12
# After a stop the capsule follows the body forward while it coasts (up to this
# many units), so the body ends standing on its capsule: no rebound and no step
# back to the capsule (0 = off: the absorb above).
# OPENMW_RAGDOLL_STOP_CARRY = 40
# Take the routed weight off a foot the clip is lifting (units of lift; 0 = off).
# OPENMW_RAGDOLL_SOFT_ROOT_LIFT_UNROUTE = 0

# --- Weapon and attacks -----------------------------------------------------
# While moving: 0 = carry the weapon low and let the free hand swing, 1 = guard
# stays up (the old "zombie arms"), 2 = a low ready guard (use TIP_WALK_CARRY = 15,5).
# OPENMW_RAGDOLL_WALK_GUARD = 0
# Where the weapon tip rests while carried (azimuth, elevation degrees) and how
# fast it moves between guard and carry (per second).
# OPENMW_RAGDOLL_TIP_WALK_CARRY = 20,-30
# OPENMW_RAGDOLL_TIP_WALK_CARRY_RATE = 4
# A hold released without dragging attacks (0 = returns to the guard).
# OPENMW_RAGDOLL_TIP_HOLD_ATTACK = 1
# Minimum weapon acceleration, rad/s^2.
# OPENMW_RAGDOLL_TIP_ALPHA_MIN = 250
# The body turns into a punch, degrees.
# OPENMW_RAGDOLL_TIP_PUNCH_TWIST = 15
# High block pose while guarding: azimuth,elevation degrees.
# OPENMW_RAGDOLL_TIP_BLOCK = -20,55
# How fast the solved elbow may move, units/s (stops mid-swing elbow flips).
# OPENMW_RAGDOLL_ARM_ELBOW_SPEED = 250
# Price the weapon tip on this lever, units (long weapons).
# OPENMW_RAGDOLL_ARM_TIP_LEVER = 20
# Each drag stroke (the drag reversing direction) can land its own hit (0 = one per hold).
# OPENMW_RAGDOLL_TIP_STROKE_SWINGS = 1
# Blades embedded deeper than this after a swing slide out, units.
# OPENMW_RAGDOLL_EMBED_RELEASE_DEPTH = 1
# Armed NPCs (long weapons) attack through the tip controller instead of
# their physical arm following the attack animation (1 = on, the default since
# alpha 0.4: blades flailed 64-80% of the time on the animation-driven arm, 3-15%
# on the controller). With HSC_NPC=1 (the launcher) NPCs use the cut wheel instead.
# OPENMW_RAGDOLL_TIP_NPC = 1
