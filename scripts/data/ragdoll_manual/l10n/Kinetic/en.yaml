pageName: "KINETIC"
pageDescription: "Physical combat switches. Changes take effect the next time you start the game."
groupName: "Physical combat"
groupDescription: "Default keeps the build's setting. A launcher that sets the same switch wins."
Default: "Default"
On: "On"
Off: "Off"
Light: "Light"
Vanilla: "Vanilla"
Rare: "Rare"
Normal: "Normal"
Strong: "Strong"
Small: "Small"
Large: "Large"
fallProtectName: "Falls try to catch themselves"
fallProtectDescription: "Falling bodies reach for the ground and tuck the chin instead of going limp."
balanceName: "Balance helper"
balanceDescription: "Catch steps and leg bracing that keep a pushed body on its feet."
headDazeName: "Head blows daze"
headDazeDescription: "A head hit makes the knees give and the feet slow for a moment."
rmbGuardName: "Right-click guard"
rmbGuardDescription: "With a weapon drawn the right button guards: hold it and move the mouse to pick where (up covers an overhead chop), tap it just before a blow to parry. The inventory is on I (and on the right button with the weapon sheathed)."
hitPushName: "Hit reactions"
hitPushDescription: "How strongly a struck body reacts: the push, the snap and the reflexes (Strong: near-falls)."
parryKnockName: "Parry knock"
parryKnockDescription: "A blade that is hit is knocked along the attacker's swing."
windUpName: "Swing wind-up"
windUpDescription: "Slow drags bend the elbows; fast strokes extend the arms through the hit."
sparksName: "Sparks"
sparksDescription: "Sparks when blades clash or strike metal armour."
cameraKickName: "Camera kick"
cameraKickDescription: "The view jolts when you are hit."
knockdownsName: "Knockdowns"
knockdownsDescription: "A blow that staggers can knock the body down by Morrowind's own odds (damage against Agility). Rare counts half the damage."
hudGroupName: "Reticle"
hudGroupDescription: "The brass diamond at the centre of the screen. Changes show when you close the menu."
reticleOpacityName: "Reticle opacity"
reticleOpacityDescription: "How solid the reticle is drawn (1 = full)."
reticleSizeName: "Reticle size"
reticleSizeDescription: "How large the reticle is drawn (1 = normal)."
reticleTrajectoryName: "Swing path"
reticleTrajectoryDescription: "Once an attack is let go, dots show where the weapon's tip is driven through the cut, so you can see how your aim places it."
